# Intentionally violates K8sBlockPrivileged (policies/gatekeeper/constraints/enforce-block-privileged.yaml)
# and only that policy — passes the non-root and resource-limits checks so
# run-fixtures.sh's per-fixture result maps to exactly one policy.
# Applied with --dry-run=server by policies/gatekeeper/fixtures/run-fixtures.sh — must be rejected.
apiVersion: v1
kind: Pod
metadata:
  name: fixture-privileged
  namespace: platform-status
  labels:
    app.kubernetes.io/part-of: gatekeeper-fixtures
spec:
  containers:
    - name: fixture
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
        runAsNonRoot: true
        runAsUser: 1000
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          memory: 64Mi
