# Intentionally violates K8sRequireNonRoot (policies/gatekeeper/constraints/enforce-non-root.yaml)
# and only that policy — passes resources and the privileged check so
# run-fixtures.sh's per-fixture result maps to exactly one policy.
# Applied with --dry-run=server by policies/gatekeeper/fixtures/run-fixtures.sh — must be rejected.
apiVersion: v1
kind: Pod
metadata:
  name: fixture-root-user
  namespace: platform-status
  labels:
    app.kubernetes.io/part-of: gatekeeper-fixtures
spec:
  containers:
    - name: fixture
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        runAsUser: 0
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          memory: 64Mi
