# Intentionally violates K8sRequireResourceLimits (policies/gatekeeper/constraints/enforce-resource-limits.yaml).
# Applied with --dry-run=server by policies/gatekeeper/fixtures/run-fixtures.sh — must be rejected.
apiVersion: v1
kind: Pod
metadata:
  name: fixture-no-resource-limits
  namespace: platform-status
  labels:
    app.kubernetes.io/part-of: gatekeeper-fixtures
spec:
  containers:
    - name: fixture
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
