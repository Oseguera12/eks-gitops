[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# E/F/W: standard pycodestyle/pyflakes errors
# I: isort-compatible import sorting
# UP: pyupgrade — modernize syntax for the target Python version
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# pytest-asyncio 1.0+ warns if asyncio_default_fixture_loop_scope is not set.
# "function" scopes each test to its own event loop, which is the default
# behavior of prior versions and safe for stateless FastAPI tests.
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
