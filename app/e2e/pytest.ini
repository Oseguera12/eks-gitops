[pytest]
testpaths = .
markers =
    case(id): regression case ID from MANUAL_TEST_PLAN.md
    ui: drives a real browser (Chromium) instead of the HTTP API
addopts =
    --strict-markers
    -p no:cacheprovider
    -ra
    --browser chromium
    --tracing retain-on-failure
    --screenshot only-on-failure
    --output test-results/artifacts
    --junitxml test-results/junit.xml
