name: Infrastructure — Terraform Plan / Apply

# Separate workflow for infrastructure changes.
# Application deploys (image tag bumps) go through ci-cd.yml.
#
# Workflow:
#   pull_request → terraform plan (plan stored as PR comment)
#   push to main → terraform apply (only if plan succeeds)

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch: {} # manual re-apply — e.g. recreating infra for a demo session
    # without touching terraform/**; used by deploy.yml's terraform-apply job

permissions:
  contents: read
  pull-requests: write  # Post plan output as PR comment
  id-token: write       # OIDC

env:
  TF_VERSION: "1.15.7"
  AWS_REGION: us-east-1
  TF_VAR_aws_region: us-east-1

jobs:
  terraform:
    name: Terraform ${{ github.event_name == 'pull_request' && 'Plan' || 'Apply' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: Terraform-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_DYNAMODB_TABLE }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Validate
        run: terraform validate

      # No -var-file here: terraform.tfvars is gitignored and never exists on a
      # CI runner. variables.tf defaults mirror terraform.tfvars.example, so
      # the defaults ARE the intended CI config.
      # Actions' default bash runs with -o pipefail, so a failed plan fails this
      # step despite the tee. continue-on-error lets the PR still get the
      # (failed) plan as a comment; "Fail if plan failed" below turns the job red.
      # Values marked `sensitive` are redacted by Terraform in plan.txt.
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -out=tfplan \
            -no-color 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n\n... (truncated)'
              : plan;
            const output = `### Terraform Plan\n\`\`\`terraform\n${truncated}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output,
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform apply -auto-approve tfplan
