name: CI / CD — DevSecOps Pipeline

# Triggers:
#   push to main  → full pipeline (security scan + build + sign + deploy)
#   pull request  → security scans + lint + unit tests + Playwright regression
#                   (no ECR push, no deploy)
#
# Authentication:
#   AWS credentials are NEVER stored as secrets.
#   GitHub Actions authenticates to AWS via OIDC — the workflow exchanges
#   a short-lived GitHub token for temporary AWS credentials scoped to the
#   iam_github_oidc IAM role created by Terraform.
#
# Supply chain:
#   Every third-party action is pinned to a full commit SHA (tag in the
#   trailing comment). .github/dependabot.yml opens PRs to bump them.
#
# Pipeline stages (in dependency order):
#   1. secret-scan    — Gitleaks: detect hardcoded credentials before any build
#   2. sast           — Semgrep: static analysis for security bugs
#   3. sca            — pip-audit: known CVEs in Python dependencies
#   4. lint           — Hadolint (Dockerfile) + Ruff (Python)
#   5. test           — pytest unit tests with coverage report
#   6. regression     — Playwright: black-box regression suite against the
#                       built container, run with the cluster's securityContext
#   7. iac-scan       — Checkov: IaC policy scan on Terraform files
#   8. build-push     — Docker build, push to ECR (main only)
#   9. sign           — Cosign keyless image signing via Sigstore (main only)
#  10. scan-image     — Trivy full image scan + SBOM generation (main only)
#  11. deploy         — Update image digest in Git, ArgoCD syncs staging (main only)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read  # Default — individual jobs escalate as needed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; main runs never are, so a deploy can't
  # be killed halfway through writing the image digest back to Git.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: platform-status
  IMAGE_NAME: platform-status
  PYTHON_VERSION: "3.12"
  CLUSTER_NAME: eks-gitops
  # Within one minor of the cluster (terraform/variables.tf kubernetes_version);
  # the runner's preinstalled kubectl tracks the newest release instead.
  KUBECTL_VERSION: v1.35.9

jobs:
  # ─── Stage 1: Secret Scanning ─────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history required for Gitleaks commit-range scan
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ─── Stage 2: SAST ────────────────────────────────────────────────────────
  # returntocorp/semgrep-action is deprecated; the CLI is the supported path.
  # --error makes findings blocking. Intentional exceptions are inline
  # `nosemgrep` comments with a reason, or listed in .semgrepignore.
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: secret-scan
    permissions:
      contents: read
      security-events: write  # Upload SARIF to GitHub Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Semgrep
        run: |
          pip install semgrep==1.179.0
          semgrep scan \
            --config p/python \
            --config p/docker \
            --config p/kubernetes \
            --config p/secrets \
            --config p/owasp-top-ten \
            --config p/github-actions \
            --metrics=off \
            --error \
            --sarif-output=semgrep.sarif

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ─── Stage 3: SCA — Dependency CVE Scan ──────────────────────────────────
  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        # Runtime, unit-test, and Playwright dependencies — all three run in CI.
        run: |
          pip-audit \
            --requirement app/requirements.txt \
            --requirement app/requirements-dev.txt \
            --requirement app/e2e/requirements.txt \
            --format json \
            --output pip-audit-results.json \
            --strict

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pip-audit-results
          path: pip-audit-results.json
          retention-days: 30

  # ─── Stage 4: Lint ────────────────────────────────────────────────────────
  lint:
    name: Lint (Hadolint + Ruff)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hadolint — Dockerfile best practices
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: warning

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Ruff — Python linter
        run: |
          pip install "$(grep '^ruff==' app/requirements-dev.txt)"
          ruff check app/src/ app/tests/ app/e2e/ scripts/
          ruff format --check app/src/ app/tests/ app/e2e/

  # ─── Stage 5: Unit Tests ──────────────────────────────────────────────────
  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    needs: [sca, lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt -r app/requirements-dev.txt

      - name: Run tests with coverage
        working-directory: app
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            -v

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: app/coverage.xml
          retention-days: 30

  # ─── Stage 6: Playwright Regression ───────────────────────────────────────
  # Builds the same image build-push will push (same Dockerfile, build args,
  # and GHA layer cache), starts it read-only / non-root / no capabilities,
  # waits on the image's own HEALTHCHECK, then runs app/e2e against it.
  # Results land in the job summary and the playwright-regression artifact
  # (regression-metrics.json, JUnit XML, and traces for any failure).
  regression:
    name: Regression Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [sca, lint]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute build version
        id: version
        run: echo "app-version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image under test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/
          file: app/Dockerfile
          load: true
          push: false
          tags: platform-status:regression
          build-args: APP_VERSION=${{ steps.version.outputs.app-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/e2e/requirements.txt

      - name: Install Playwright + Chromium
        run: |
          pip install -r app/e2e/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run regression suite
        env:
          IMAGE: platform-status:regression
          APP_VERSION: ${{ steps.version.outputs.app-version }}
          PROJECT: eks-gitops
        run: scripts/run-regression.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-regression
          path: app/e2e/test-results/
          retention-days: 30
          if-no-files-found: warn

  # ─── Stage 7: IaC Security Scan ───────────────────────────────────────────
  iac-scan:
    name: IaC Scan (Checkov)
    runs-on: ubuntu-latest
    needs: secret-scan
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@c13aafd679d3814a25067d10fcaf98c4f7594931 # v12.3131.0
        with:
          directory: terraform/
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: false
          # Repo-wide skips only. Resource-specific exceptions are inline
          # #checkov:skip comments next to the resource, each with a reason.
          skip_check: >-
            CKV_AWS_130,
            CKV2_AWS_12

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov

  # ─── Stage 8: Build & Push to ECR ────────────────────────────────────────
  build-push:
    name: Build & Push (ECR)
    runs-on: ubuntu-latest
    needs: [sast, test, regression, iac-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write  # Required for OIDC authentication to AWS
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      ecr-image: ${{ steps.build.outputs.ecr-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute build version
        id: version
        run: echo "app-version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC — no long-lived keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/
          file: app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Same build arg the regression job tested with; /info reports it.
          build-args: APP_VERSION=${{ steps.version.outputs.app-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true  # Generate SBOM attestation alongside the image

      - name: Output image reference
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}@${DIGEST}"
          echo "ecr-image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed: ${IMAGE}"

  # ─── Stage 9: Keyless Image Signing (Cosign + Sigstore) ──────────────────
  sign:
    name: Sign Image (Cosign)
    runs-on: ubuntu-latest
    needs: build-push
    permissions:
      contents: read
      id-token: write       # OIDC token for Sigstore Fulcio CA
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pinned to the newest 2.x (upstream supports only the last 2.x
          # release) instead of the action's default "latest", which would
          # silently jump to v3. v3 changes defaults (bundle format, Rekor v2),
          # so re-check `cosign verify` after a deliberate major bump.
          cosign-release: "v2.6.5"

      - name: Sign the image (keyless — identity bound to this workflow)
        env:
          IMAGE: ${{ needs.build-push.outputs.ecr-image }}
        run: |
          cosign sign --yes "${IMAGE}"
          echo "Image signed. Verify with:"
          echo "  cosign verify ${IMAGE} \\"
          echo "    --certificate-identity-regexp 'https://github.com/Oseguera12/eks-gitops' \\"
          echo "    --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'"

  # ─── Stage 10: Container Image Scan + SBOM ───────────────────────────────
  scan-image:
    name: Image Scan (Trivy) + SBOM (Syft)
    runs-on: ubuntu-latest
    needs: build-push
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Trivy — full image vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.build-push.outputs.ecr-image }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"   # Fail the build on any CRITICAL or HIGH CVE

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Syft — generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ needs.build-push.outputs.ecr-image }}
          format: spdx-json
          artifact-name: sbom.spdx.json

  # ─── Stage 11: Deploy via GitOps ─────────────────────────────────────────
  deploy:
    name: Deploy (ArgoCD GitOps)
    runs-on: ubuntu-latest
    # build-push must be listed directly: `needs.<job>.outputs` only resolves
    # for direct dependencies, so omitting it makes DIGEST an empty string.
    needs: [build-push, sign, scan-image]
    # The canary alone is ~15 min (5m pause, 5m analysis, 5m pause).
    timeout-minutes: 40
    permissions:
      contents: write  # Write back the updated image digest to Git
      id-token: write
    steps:
      # Credentials persist on purpose: this job pushes the digest commit.
      # It uploads no artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true  # zizmor: ignore[artipacked]

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Update image digest in Rollout manifest
        id: pin
        env:
          DIGEST: ${{ needs.build-push.outputs.image-digest }}
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "invalid image digest: '${DIGEST}'"; exit 1; }
          # Replace the image reference in the Kustomize base with the
          # immutable digest. Using digest (not tag) ensures ArgoCD deploys
          # exactly the signed, scanned image — not a tag that could be
          # overwritten. The staging overlay has no image patch of its own,
          # so this always flows straight through to workloads-staging;
          # promoting it to prod is a separate, manual step — see
          # .github/workflows/promote-to-prod.yml.
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}@${DIGEST}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          sed -i "s|image:.*platform-status.*|image: ${IMAGE}|g" \
            kubernetes/workloads/platform-status/base/rollout.yaml

          # A cached rebuild can reproduce the same digest; that's a no-op, not a failure.
          if git diff --quiet -- kubernetes/workloads/platform-status/base/rollout.yaml; then
            echo "Staging already runs ${DIGEST:0:19}; nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/workloads/platform-status/base/rollout.yaml
          git commit -m "chore(deploy): update platform-status to ${DIGEST:0:19} [skip ci]"
          git push

      - name: Install kubectl (pinned, checksum-verified)
        run: |
          base="https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64"
          curl -fsSLO "${base}/kubectl"
          echo "$(curl -fsSL "${base}/kubectl.sha256")  kubectl" | sha256sum --check --strict -
          sudo install -m 0755 kubectl /usr/local/bin/kubectl

      - name: Point kubectl at the cluster
        run: aws eks update-kubeconfig --region "${AWS_REGION}" --name "${CLUSTER_NAME}"

      # Argo CD (not this job) applies the change. Going through the
      # Kubernetes API means no Argo CD endpoint or token is exposed to CI;
      # the job only confirms the canary actually completed in staging.
      - name: Wait for the staging canary to complete
        id: rollout
        env:
          IMAGE: ${{ steps.pin.outputs.image }}
        run: |
          kubectl -n argocd annotate application workloads-staging \
            argocd.argoproj.io/refresh=normal --overwrite
          scripts/wait-for-rollout.sh platform-status-staging platform-status "${IMAGE}"

      - name: Deployment summary
        env:
          IMAGE: ${{ steps.pin.outputs.image }}
          ROLLOUT_SECONDS: ${{ steps.rollout.outputs.rollout_seconds }}
        run: |
          {
            echo "### Staging deploy"
            echo "- Image: \`${IMAGE##*@}\`"
            echo "- Commit to Healthy (canary incl. analysis): ${ROLLOUT_SECONDS}s"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── Pipeline Summary ─────────────────────────────────────────────────────
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [secret-scan, sast, sca, lint, test, regression, iac-scan, build-push, sign, scan-image, deploy]
    if: always()
    permissions:
      contents: read
      actions: read  # gh api .../jobs, to read each stage's real duration
    steps:
      - name: Print pipeline outcome
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "=== Pipeline Results ==="
          echo "${RESULTS}" | jq -r 'to_entries[] | "\(.key | . + ":" | .[0:14]) \(.value.result)"'

      # Feeds the "gate durations" field in metrics/runtime-metrics.json — see
      # the "Runtime Metrics" workflow, which downloads this artifact and
      # merges it with the Falco drill + Gatekeeper fixture results. Reads
      # real per-job wall time from the Actions API instead of guessing.
      - name: Collect gate durations for runtime-metrics.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --paginate \
            --jq '.jobs[] | select(.name != "Pipeline Summary") | {name, conclusion, started_at, completed_at}' \
            | python3 -c '
          import sys, json, datetime

          gates = []
          for line in sys.stdin:
              line = line.strip()
              if not line:
                  continue
              job = json.loads(line)
              started, completed = job.get("started_at"), job.get("completed_at")
              duration_ms = 0
              if started and completed:
                  t0 = datetime.datetime.fromisoformat(started.replace("Z", "+00:00"))
                  t1 = datetime.datetime.fromisoformat(completed.replace("Z", "+00:00"))
                  duration_ms = max((t1 - t0).total_seconds() * 1000, 0)
              conclusion = job.get("conclusion")
              status = "pass" if conclusion == "success" else "skipped" if conclusion in ("skipped", "cancelled", None) else "fail"
              gates.append({"name": job["name"], "status": status, "duration_ms": duration_ms})
