# Runtime Security Application — Falco/Gatekeeper alert rules + Grafana
# dashboard, both targeting the monitoring namespace. Split out of the old
# combined `workloads` Application when that Application was repointed at
# the prod-only overlay (kubernetes/workloads/platform-status/overlays/prod)
# — this content was never platform-status-specific to begin with.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: runtime-security
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/Oseguera12/eks-gitops.git
    targetRevision: main
    path: kubernetes/workloads/runtime-security
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
