# NGINX Gateway Fabric — Gateway API implementation, replacing the
# now-archived ingress-nginx (best-effort maintenance ended March 2026, no
# further releases or security fixes; the Gateway API is the Kubernetes
# SIG-Network-designated successor). Chart auto-creates a GatewayClass named
# "nginx" (nginxGateway.gatewayClassName below); the actual Gateway listener
# is authored separately in gateway.yaml, once this controller exists to
# reconcile it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-gateway-fabric
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: ghcr.io/nginx/charts
    chart: nginx-gateway-fabric
    targetRevision: "2.6.7"
    helm:
      releaseName: nginx-gateway-fabric
      values: |
        nginxGateway:
          gatewayClassName: nginx
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
        nginx:
          replicas: 1
          container:
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
