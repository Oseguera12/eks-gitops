# External Secrets Operator — pulls secrets from AWS Secrets Manager into
# native Kubernetes Secret objects. Service account is annotated with the
# IRSA role ARN so pods authenticate to AWS without any credentials stored
# in the cluster.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    # Exact pin. 2.x serves only external-secrets.io/v1 (v1beta1 is off
    # unless crds.unsafeServeV1Beta1 is set) — cluster-secret-store.yaml uses v1.
    targetRevision: "2.12.0"
    helm:
      releaseName: external-secrets
      values: |
        installCRDs: true
        replicaCount: 1
        serviceAccount:
          annotations:
            # IRSA — this annotation binds the k8s SA to the IAM role created by Terraform.
            # Replace with the actual ARN from `terraform output external_secrets_role_arn`.
            eks.amazonaws.com/role-arn: "REPLACE_WITH_TERRAFORM_OUTPUT_external_secrets_role_arn"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
