# ClusterSecretStore — cluster-wide backend pointing at AWS Secrets Manager.
# All ExternalSecret resources reference this store by name.
# Deployed as a standalone manifest (not via Helm) so ArgoCD can track it.

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1  # Must match var.aws_region in Terraform
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
