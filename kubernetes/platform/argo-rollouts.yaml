# Argo Rollouts — progressive delivery controller.
# Enables canary and blue/green deployment strategies with automated
# metric-based promotion and rollback via AnalysisTemplate CRs.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  annotations:
    # Wave 3: the chart's ServiceMonitor needs the CRD from
    # prometheus-stack (wave 2).
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    # Pinned to 2.41.1 (latest stable) instead of a floating "2.38.*".
    targetRevision: "2.41.1"
    helm:
      releaseName: argo-rollouts
      values: |
        controller:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
          # rollout.yaml routes canary traffic through this plugin; without it
          # the controller logs "plugin not configured" and every canary
          # stalls at its first setWeight. The binary is downloaded at
          # controller start and checked against sha256. linux-amd64 matches
          # the t3.medium node group — use the -arm64 asset for Graviton.
          trafficRouterPlugins:
            - name: argoproj-labs/gatewayAPI
              location: https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/v0.17.0/gatewayapi-plugin-linux-amd64
              sha256: 1904ca787d33107c140521899d61fff030ee75d99908bd175fca5a4647759061
        dashboard:
          enabled: true
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
