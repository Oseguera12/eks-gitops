# OPA Gatekeeper — admission controller enforcing policy-as-code.
# Constraints are defined separately in policies/gatekeeper/constraints/.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatekeeper
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://open-policy-agent.github.io/gatekeeper/charts
    chart: gatekeeper
    # Pinned to 3.23.0 (latest stable at time of pinning) instead of a floating
    # "3.17.*". Gatekeeper 3.18 made the `generate` operation required for CRD
    # and ValidatingAdmissionPolicy generation — gatekeeper-audit must run with
    # --operation=generate, which the chart already sets by default from 3.18
    # onward. Reviewed: no custom operation flags are overridden in this stack.
    targetRevision: "3.23.0"
    helm:
      releaseName: gatekeeper
      values: |
        replicaCount: 1
        auditInterval: 60
        constraintViolationsLimit: 20
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        audit:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
        # Exempt the ArgoCD and monitoring namespaces from policy enforcement
        # to prevent circular dependency issues during bootstrapping.
        exemptNamespaces:
          - kube-system
          - argocd
          - gatekeeper-system
          - cert-manager
          - external-secrets
          - monitoring
          - argo-rollouts
  destination:
    server: https://kubernetes.default.svc
    namespace: gatekeeper-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
