# ArgoCD Helm values — bootstrap installation.
# After first install, ArgoCD manages itself via the app-of-apps pattern.
# See kubernetes/platform/argocd/values.yaml for the GitOps-managed version.

global:
  domain: ""  # No ingress on bootstrap — port-forward only until cert-manager is ready

configs:
  params:
    server.insecure: "true"  # TLS terminated at the ingress layer
  cm:
    # Enable Application Sets and the app-of-apps pattern
    application.resourceTrackingMethod: annotation
    # Sync policy: auto-prune and self-heal
    resource.customizations.health.argoproj.io/Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

  rbac:
    policy.default: role:readonly
    policy.csv: |
      p, role:admin, applications, *, */*, allow
      p, role:admin, clusters, get, *, allow
      p, role:admin, repositories, get, *, allow
      g, argocd-admins, role:admin

server:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

applicationSet:
  replicas: 1

redis:
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 128Mi

# Disable Dex — GitHub SSO can be configured post-bootstrap
dex:
  enabled: false
