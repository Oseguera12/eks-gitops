# ArgoCD Helm values — installed once per cluster by deploy.yml / README
# Step 7 (helm install, chart pinned there). Argo CD does not manage itself.

global:
  domain: ""  # no ingress — reached only through kubectl port-forward

configs:
  params:
    # Plain HTTP inside the cluster. Safe only because argocd-server is
    # ClusterIP and never exposed; add TLS before giving it an ingress.
    server.insecure: "true"
  cm:
    application.resourceTrackingMethod: annotation
    # Health check for child Applications. Without it Argo CD treats every
    # Application as Healthy immediately, so sync waves in the app-of-apps
    # don't actually wait (e.g. CRDs from a wave-1 chart aren't there yet
    # when wave 2 applies). The key uses `_`, not `/` — ConfigMap keys
    # can't contain a slash and the API server rejects argocd-cm.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

  rbac:
    policy.default: role:readonly
    policy.csv: |
      p, role:admin, applications, *, */*, allow
      p, role:admin, clusters, get, *, allow
      p, role:admin, repositories, get, *, allow
      g, argocd-admins, role:admin

server:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

applicationSet:
  replicas: 1

redis:
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 128Mi

# Disable Dex — GitHub SSO can be configured post-bootstrap
dex:
  enabled: false
