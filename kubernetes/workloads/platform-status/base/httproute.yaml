# HTTPRoute — the route Argo Rollouts' Gateway API plugin manages directly,
# shifting the weight between the stable/canary backendRefs at each canary
# step (kubernetes/workloads/platform-status/base/rollout.yaml's
# trafficRouting.plugins.argoproj-labs/gatewayAPI block).
#
# Attaches to the shared Gateway in the nginx-gateway namespace
# (kubernetes/platform/nginx-gateway-fabric.yaml) via a cross-namespace
# parentRef — allowed because that Gateway's listener sets
# allowedRoutes.namespaces.from: All. Both stable and canary backendRefs stay
# in this same namespace as the HTTPRoute itself, so no ReferenceGrant is
# needed (that's only required for cross-namespace backendRefs).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: platform-status
spec:
  parentRefs:
    - name: eks-gitops
      namespace: nginx-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: platform-status-stable
          kind: Service
          port: 80
          weight: 100
        - name: platform-status-canary
          kind: Service
          port: 80
          weight: 0
